[package]
name = "money-cockpit"
version = "0.1.0"
edition = "2021"
authors = ["Maxime Oriol"]
description = "Open source, human-built personal finance manager. Local-first, privacy-focused."
license = "GPL-3.0-only"
repository = "https://github.com/Mapeeks/money-cockpit"
readme = "README.md"

[lib]
name = "money_cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
