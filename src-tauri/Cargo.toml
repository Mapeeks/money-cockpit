[package]
name = "money-cockpit"
version = "0.1.0"
edition = "2021"
authors = ["Maxime Oriol"]
description = "Open source, human-built personal finance manager. Local-first, privacy-focused."
license = "GPL-3.0-only"
repository = "https://github.com/Mapeeks/money-cockpit"
readme = "README.md"

[dependencies]
# Tauri — desktop runtime
tauri = { version = "2", features = [] }

# SQLite — local storage, no server
rusqlite = { version = "0.31", features = ["bundled"] }

# Serialization — Tauri command payloads (JSON between Rust and TypeScript)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Optimise for binary size — consistent with the local-first, lightweight philosophy
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
