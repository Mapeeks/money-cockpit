<div class="status-bar">
    <div class="status-bar__left">
        <button class="status-bar__toggle-sidebar-btn" id="toggle-sidebar" title="Toggle sidebar">
            <i data-lucide="panel-left-close"></i>
        </button>
        <span class="status-bar__stat"
            >Total cleared balance:
            <span class="amount amount--positive" id="status-cleared-balance">+7 123 €</span></span
        >
        <span class="status-bar__separator">·</span>
        <span class="status-bar__stat"
            >Total incoming:
            <span class="amount amount--positive" id="status-incoming-balance">+6 842 €</span></span
        >
    </div>
    <div class="status-bar__right">
        <span class="status-bar__version" id="status-version"></span>
        <button class="status-bar__update-btn" id="status-check-update" title="Check for updates">
            <i data-lucide="arrow-down-to-line"></i>
        </button>
    </div>
</div>
